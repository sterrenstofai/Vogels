# Instellingen voor Netlify. Kies in Netlify de map `boekvanjou` als basismap van de site.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# Zonder deze regel uploadt Netlify de build zonder er een Next.js-site van te maken.
[[plugins]]
  package = "@netlify/plugin-nextjs"
