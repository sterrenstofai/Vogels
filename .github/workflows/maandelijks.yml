name: Meldingen verversen

# Elke maand de laatste vijf jaar meldingen van GBIF ophalen en de sitedata opnieuw bouwen.
# Een push naar main zet de site via Netlify vanzelf live.
on:
  schedule:
    - cron: "17 3 2 * *"   # de 2e van elke maand, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sitedata
  cancel-in-progress: false

jobs:
  verversen:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install shapely
      - name: Meldingen ophalen en sitedata bouwen
        run: python3 scripts/maandelijks.py
      - name: Committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/data site/index.html site/hoe-dit-werkt.html
          git diff --cached --quiet && exit 0
          git commit -m "Meldingen ververst tot en met $(date -d "$(date +%Y-%m-01) -1 day" +%Y-%m-%d)"
          git pull --rebase origin main
          git push
