name: Zeezicht beelden zoeken

# Zoekt kandidaat-foto's, -platen en -geluiden op Commons en haalt de Wikipedia-teksten op (Wikimedia geeft
# vanaf de ontwikkelmachine een 429). Uitkomsten in zeedieren/werk/, terug op dezelfde tak.
on:
  push:
    branches: [claude/new-session-ulffx4]
    paths: ["zeedieren/scripts/beelden_zoeken.py", "zeedieren/data/zoekvragen.json"]
  workflow_dispatch:

permissions:
  contents: write
concurrency: zeedieren

jobs:
  zoeken:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - run: cd zeedieren && python3 scripts/beelden_zoeken.py
      - name: Terugzetten
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f zeedieren/werk
          git diff --cached --quiet || git commit -m "Zeezicht: kandidaten voor beelden en Wikipedia-teksten"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
