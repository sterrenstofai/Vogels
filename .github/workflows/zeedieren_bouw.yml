name: Zeezicht nakijken en bouwen

# Kijkt de weetjes na tegen Wikipedia (scripts/nakijken.py; Wikipedia geeft vanaf de ontwikkelmachine een 429)
# en bouwt site/data opnieuw. Draait bij een wijziging in het handwerk, of met de hand.
on:
  push:
    branches: [claude/new-session-ulffx4]
    paths: ["zeedieren/data/handwerk/**", "zeedieren/scripts/nakijken.py", "zeedieren/scripts/bouw_site_data.py", "zeedieren/data/veiligheid.json", "zeedieren/data/soorten.json"]
  workflow_dispatch:

permissions:
  contents: write
concurrency: zeedieren

jobs:
  bouwen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/new-session-ulffx4 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: cd zeedieren && python3 scripts/nakijken.py && python3 scripts/bouw_site_data.py
      - name: Terugzetten
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zeedieren/data/nagekeken.json zeedieren/site/data zeedieren/netlify.toml
          git diff --cached --quiet || git commit -m "Zeezicht: weetjes nagekeken en sitedata gebouwd"
          git pull --rebase origin claude/new-session-ulffx4
          git push origin HEAD:claude/new-session-ulffx4
