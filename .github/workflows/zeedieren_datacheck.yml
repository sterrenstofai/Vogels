name: Zeedieren datacheck (Wikimedia)

# Fase 1 van het zeedierenproject. Wikimedia (Commons, Wikipedia) geeft vanaf de ontwikkelmachine een 429,
# daarom draait dit deel hier. De uitkomsten komen terug op dezelfde tak.
on:
  push:
    branches: [claude/new-session-ulffx4]
    paths:
      - "zeedieren/datacheck/wikimedia.py"
      - "zeedieren/datacheck/weetjes.json"
      - "zeedieren/datacheck/platen_zoekvragen.json"
      - ".github/workflows/zeedieren_datacheck.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wikimedia:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cd zeedieren/datacheck && python3 wikimedia.py
      - name: Uitkomsten terugzetten
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zeedieren/datacheck/uitkomsten
          git diff --cached --quiet || git commit -m "Zeedieren datacheck: uitkomsten Wikimedia"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
