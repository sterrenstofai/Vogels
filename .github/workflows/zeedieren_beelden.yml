name: Zeezicht beelden ophalen

# Haalt de gekozen foto's, platen en geluiden op van Commons (data/beeld_keuze.json) en zet ze in zeedieren/site.
on:
  push:
    branches: [claude/new-session-ulffx4]
    paths: ["zeedieren/data/beeld_keuze.json", "zeedieren/scripts/beelden_ophalen.py"]
  workflow_dispatch:

permissions:
  contents: write
concurrency: zeedieren

jobs:
  ophalen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow && sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: cd zeedieren && python3 scripts/beelden_ophalen.py
      - name: Terugzetten
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zeedieren/site/fotos zeedieren/site/platen zeedieren/site/klanken zeedieren/data/beelden.json
          git diff --cached --quiet || git commit -m "Zeezicht: foto's, platen en geluiden van Commons"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
